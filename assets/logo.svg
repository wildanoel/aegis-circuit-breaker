<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17151F"/>
      <stop offset="1" stop-color="#0D0B12"/>
    </linearGradient>
    <linearGradient id="shield" x1="128" y1="96" x2="384" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B98BFF"/>
      <stop offset="1" stop-color="#7C4DF0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="256" y1="96" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9C4FF"/>
      <stop offset="1" stop-color="#6D3FE0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- shield -->
  <path d="M256 92 L400 148 V268 C400 350 336 404 256 432 C176 404 112 350 112 268 V148 Z"
        fill="url(#shield)" fill-opacity="0.14" stroke="url(#stroke)" stroke-width="10"/>

  <!-- circuit-breaker / power switch motif -->
  <circle cx="256" cy="262" r="86" stroke="url(#stroke)" stroke-width="12" fill="none" stroke-opacity="0.55"/>
  <!-- break in the ring at top -->
  <rect x="236" y="150" width="40" height="46" fill="url(#bg)"/>
  <!-- the switch bar -->
  <line x1="256" y1="176" x2="256" y2="278" stroke="url(#stroke)" stroke-width="16" stroke-linecap="round"/>

  <!-- validator consensus triangle accent -->
  <path d="M256 330 L292 372 H220 Z" fill="url(#stroke)" fill-opacity="0.9"/>
</svg>
